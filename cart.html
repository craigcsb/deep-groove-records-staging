<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — Deep Groove Records</title>
  <link rel="stylesheet" href="css/modernist.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- =========================================================
       ADOBE WEB SDK EMBED CODE — paste on every page (see index.html)
  ========================================================== -->
  <!-- Command queue stub: makes window.alloy available synchronously so
       calls made before the async library below finishes loading are
       queued (as pending promises) instead of silently dropped. -->
  <script>
    !function(n,o){o.forEach(function(o){n[o]||((n.__alloyNS=n.__alloyNS||[]).push(o),n[o]=
    function(){var u=arguments;return new Promise(function(i,l){n[o].q.push([i,l,u])})},n[o].q=[])})}
    (window,["alloy"]);
  </script>
  <script src="https://assets.adobedtm.com/2d725b839720/1fb6fd223988/launch-89c903526a64.min.js" async></script>

</head>
<body>

  <nav class="nav site-nav">
    <a class="nav-brand" href="index.html">Deep Groove Records</a>
    <a href="index.html">Home</a>
    <a href="products.html">Shop</a>
    <button type="button" class="btn btn-secondary auth-btn" data-auth-trigger>Sign In</button>
    <button type="button" class="btn btn-secondary btn-icon cart-btn" onclick="location.href='cart.html'" aria-label="Cart">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      <span class="cart-count" data-cart-badge>0</span>
    </button>
  </nav>

  <main class="page-wrap" id="cart-root">
    <div class="section-head"><h2>Your cart</h2></div>
    <div id="cart-body"></div>
  </main>

  <footer class="site-footer">
    Deep Groove Records — a learning site for Adobe Customer Journey Analytics / AJO. Not a real store.
  </footer>

  <script src="js/products-data.js"></script>
  <script src="js/site.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const body = document.getElementById("cart-body");

      if (cart.length === 0) {
        body.innerHTML = `
          <div class="empty-state">
            <h2>Your cart is empty</h2>
            <p>Go find something to add to it.</p>
            <a class="btn btn-primary" href="products.html">Shop all records</a>
          </div>
        `;
        return;
      }

      const rows = cart.map(function (item) {
        return `
          <tr>
            <td class="item-name">${item.name}</td>
            <td>${formatPrice(item.price)}</td>
            <td>${item.qty}</td>
            <td>${formatPrice(item.price * item.qty)}</td>
            <td>
              <button class="btn btn-ghost remove-btn" data-remove="${item.id}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                Remove
              </button>
            </td>
          </tr>
        `;
      }).join("");

      body.innerHTML = `
        <table class="table cart-table">
          <thead>
            <tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="cart-summary">
          <span class="total">Total: ${formatPrice(cartTotal(cart))}</span>
          <a class="btn btn-primary" href="checkout.html">Checkout</a>
        </div>
      `;

      body.querySelectorAll("[data-remove]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          removeFromCart(btn.getAttribute("data-remove"));
          renderCart();
        });
      });
    }

    renderCart();
    trackPageView();
  </script>
</body>
</html>
